<!DOCTYPE html>
<html> 
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">

  <!-- Blockly 核心 -->
  <script src="blockly_compressed.js"></script>
  <!-- 預設積木 -->
  <script src="blocks_compressed.js"></script>
  <!-- JS 生成器 -->
  <script src="javascript_compressed.js"></script>
  <!-- 語言檔 -->
  <script src="msg/js/zh-hant.js"></script>
  <script src="responsive_flyout.js"></script>
  <script src="direction_icons.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    #blocklyDiv {
      height: 100%;
      width: 100%;
      overflow: hidden; /* Blockly owns its workspace and flyout scrollbars. */
      touch-action: none;
    }

    /* Let Blockly calculate SVG transforms and text metrics together. */

  </style>
</head>

<body>
  <div id="blocklyDiv"></div>

  <script>
    ////////////////////////////////////////////////////////////
    // 1️⃣ 定義自訂動作 blocks
    ////////////////////////////////////////////////////////////
    const actionBlocks = [{name: 'forward', label: 'forward', direction: 'right'},
                          {name: 'backward', label: 'backward', direction: 'left'},
                          {name: 'turn_left', label: 'turn left \u{1F83C}'},
                          {name: 'turn_right', label: 'turn right \u{1F83D}'},
                          {name: 'jump_up', label: 'jump up', direction: 'up'},
                          {name: 'jump_down', label: 'jump down', direction: 'down'}
                        ];

    actionBlocks.forEach(block => {
      Blockly.Blocks[block.name] = {
        init: function() {
          const input = this.appendDummyInput().appendField(block.label);
          if (block.direction) {
            input.appendField(new Blockly.FieldImage(
              LifePilotDirectionIcon(block.direction), 36, 36, block.direction
            ));
          }
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(160);
        }
      };

      Blockly.JavaScript[block.name] = function(block) {
        return `sendActionToFlutter("${block.name}");\n`;
      };
    });

    // 定義與 Flutter 溝通的 function
    function sendActionToFlutter(action) {
      // Mobile WebView → Flutter
      if (window.BlocklyCallback) {
        BlocklyCallback.postMessage(JSON.stringify({ action }));
      }

      // Flutter Web iframe → Flutter
      window.parent.postMessage(
        { type: "blockly_action", action: action },
        "*"
      );
    }

    ////////////////////////////////////////////////////////////
    // 2️⃣ 自訂變數 block
    ////////////////////////////////////////////////////////////
    Blockly.Blocks['math_variable'] = {
      init: function() {
        this.appendDummyInput()
            .appendField(new Blockly.FieldDropdown([["→","x"], ["↑","y"]]), "VAR");
        this.setOutput(true, "Number");
        this.setColour(230);
      }
    };

    // logic_compare block 運算符下拉
    Blockly.Blocks['logic_compare'].init = function() {
      this.appendValueInput("A")
          .setCheck("Number");
      this.appendDummyInput()
          .appendField(new Blockly.FieldDropdown([["=","EQ"], ["!=","NEQ"], [">","GT"], ["<","LT"], [">=","GTE"], ["<=","LTE"]]), "OP");
      this.appendValueInput("B")
          .setCheck("Number");
      this.setInputsInline(true);
      this.setOutput(true, "Boolean");
      this.setColour(210);
    };

    ////////////////////////////////////////////////////////////
    // 3️⃣ Toolbox
    ////////////////////////////////////////////////////////////
    var toolbox = `
      <xml>
        <!-- Movement -->
        <block type="forward" gap="14"></block>
        <block type="backward" gap="14"></block>
        <!-- <block type="turn_left" gap="14"></block>
        <block type="turn_right" gap="14"></block> -->
        <block type="jump_up" gap="14"></block>
        <block type="jump_down" gap="14"></block>

        <!-- Loop -->
        <block type="controls_repeat_ext" gap="14">
          <value name="TIMES">
            <shadow type="math_number">
              <field name="NUM"></field>
            </shadow>
          </value>
        </block>

        <!-- If / Else -->
        <block type="controls_if" gap="14">
          <value name="IF0">
            <shadow type="logic_compare">
              <field name="OP">EQ</field>
              <value name="A">
                <shadow type="math_variable">
              <field name="VAR">x</field>
                </shadow>
              </value>
              <value name="B">
                <shadow type="math_number">
                  <field name="NUM"></field>
                </shadow>
              </value>
            </shadow>
          </value>
          <mutation else="1"></mutation>
        </block>
      </xml>
    `;

    ////////////////////////////////////////////////////////////
    // 建立 Blockly workspace
    ////////////////////////////////////////////////////////////
    const editorTheme = Blockly.Theme.defineTheme('life_pilot', {
      base: Blockly.Themes.Classic,
      fontStyle: { family: 'sans-serif', weight: 'bold', size: 15 },
    });
    var workspace = Blockly.inject('blocklyDiv', {
      toolbox: toolbox,
      scrollbars: true,
      theme: editorTheme,
      plugins: { flyoutsVerticalToolbox: LifePilotHalfWidthFlyout },
      zoom: {
        startScale: document.getElementById('blocklyDiv').clientWidth < 600 ? 0.8 : 1,
        minScale: 0.3,
        maxScale: 1.5,
        pinch: true,
      },
    });

    // Refit the palette after WebView rotation or parent panel resizing.
    const resizeEditor = () => {
      const flyout = workspace.getFlyout();
      if (flyout) flyout.reflow();
      Blockly.svgResize(workspace);
    };
    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(resizeEditor).observe(document.getElementById('blocklyDiv'));
    } else {
      window.addEventListener('resize', resizeEditor);
    }

    // --- 在這裡設定動態最大積木數量 ---
    window.MAX_BLOCKS = 0; // 預設為 0，Flutter 會傳實際值

    // 非阻塞提示函數
    function showWarning(msg) {
      let warningDiv = document.getElementById('warning');
      if (!warningDiv) {
        warningDiv = document.createElement('div');
        warningDiv.id = 'warning';
        warningDiv.style.position = 'absolute';
        warningDiv.style.top = '10px';
        warningDiv.style.right = '10px';
        warningDiv.style.padding = '8px 12px';
        warningDiv.style.background = 'orange';
        warningDiv.style.color = 'white';
        warningDiv.style.fontWeight = 'bold';
        warningDiv.style.borderRadius = '4px';
        warningDiv.style.zIndex = '9999';
        document.body.appendChild(warningDiv);
      }
      warningDiv.innerText = msg;
      setTimeout(() => {
        warningDiv.remove();
      }, 1500);
    }

    function countExecutableBlocks() {
      const all = workspace.getAllBlocks(false);

      let count = 0;

      all.forEach(block => {
        const type = block.type;

        // 只有這些積木應該算 1 個
        const validTypes = [
          "forward", "backward", "turn_left", "turn_right",
          "jump_up", "jump_down",
          "controls_repeat_ext",
          "controls_if"
        ];

        if (validTypes.includes(type)) {
          count++;
        }
      });

      return count;
    }

    let lastSpokenBlockId = null;

    function speakText(text) {
      try {
        window.speechSynthesis.cancel();
        let msg = new SpeechSynthesisUtterance(text);
        msg.lang = "en-US";
        msg.rate = 0.7;   // 例如 1.0 = 正常，0.8 = 慢一點，1.2 = 快一點
        window.speechSynthesis.speak(msg);
      } catch(e) {
        console.log("語音失敗:", e);
      }
    }

    workspace.addChangeListener(function(event) {
      const typesToWatch = [
        Blockly.Events.BLOCK_CREATE,
        Blockly.Events.BLOCK_DELETE
      ];

      if (!typesToWatch.includes(event.type)) {
        return;
      }
      
      // 🔊 只在開始拖曳積木時念一次
      const blockSpeak = workspace.getBlockById(event.blockId);
      if (blockSpeak) {
        const speakTextValue = blockSpeak.type.replace("controls_if","if else").replace("controls_repeat_ext","repeat").replace("_"," ");
        speakText(speakTextValue);
      }

      console.log("🔔 Blockly Event: event.type = ", event.type);
      // 若 MAX_BLOCKS 尚未設置，直接跳過限制
      if (!window.MAX_BLOCKS || window.MAX_BLOCKS <= 0) {
        console.log("🔔 Blockly Event: window.MAX_BLOCKS = ", window.MAX_BLOCKS);
        return;
      }

      const count = countExecutableBlocks(); // 🔥 使用自訂計

      if (count > window.MAX_BLOCKS) {
        // 超過限制 → 取得剛建立的積木
        // const block = workspace.getBlockById(event.blockId);
        if (blockSpeak) {
          blockSpeak.dispose(true); // 刪掉它
        }

        showWarning(`blocks should <= ${window.MAX_BLOCKS} ！`);
      }
    });


    // 監聽 Flutter 傳來的 maxBlocks
    window.addEventListener('message', (event) => {
      console.log("📩 JS 收到 message:", event.data);
      let msg = event.data;
      if (msg && msg.type === "set_max_blocks") {
        window.MAX_BLOCKS = msg.maxBlocks;
        console.log("MAX_BLOCKS updated =", window.MAX_BLOCKS);
      }
      
      // 監聽 Flutter 的請求 <web版必須加>
      else if (msg && msg.type === 'request_commands') {
        sendCommandsToFlutter(msg.bridgeId, event.origin, msg.requestId);
      }
    });

    ////////////////////////////////////////////////////////////
    // 取得 XML
    ////////////////////////////////////////////////////////////
    function getCommandsJson() {
      const xmlDom = Blockly.Xml.workspaceToDom(workspace);
      const xmlText = Blockly.Xml.domToText(xmlDom);

      return JSON.stringify({ xml: xmlText });
    }

    ////////////////////////////////////////////////////////////
    // 送回 Flutter
    ////////////////////////////////////////////////////////////
    window.sendCommandsToFlutter = function(bridgeId, targetOrigin, requestId) {
      const json = getCommandsJson();
      const response = JSON.stringify({
        type: "commands_ready", json: json, bridgeId: bridgeId, requestId: requestId
      });

      // Mobile WebView → Flutter
      if (window.BlocklyCallback) {
        BlocklyCallback.postMessage(response);
      }

      // Flutter Web iframe → Flutter
      window.parent.postMessage(
        response,
        targetOrigin || "*"
      );
    }

    window.setMaxBlocksFromFlutter = function(max) {
      window.MAX_BLOCKS = max;
      console.log("(IO) MAX_BLOCKS updated =", window.MAX_BLOCKS);
    }
  </script>
</body>
</html>
