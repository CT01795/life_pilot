name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - master  # 改成你要觸發部署的分支

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'  # 版本

      - name: Use public pub.dev access
        run: dart pub token remove https://pub.dev || true

      - name: Install dependencies
        env:
          PUB_HOSTED_URL: https://pub.dev
        run: flutter pub get

      - name: Build Web
        run: flutter build web --base-href "/life_pilot/" --release --dart-define=API_BASE_URL=https://life-pilot.onrender.com

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.LIFT_PILOT_TOKEN }}
          publish_dir: build/web
