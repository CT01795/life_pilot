name: Manual API health check

on:
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Call API health endpoint
        run: |
          echo "Ping start"
          curl -fsS --connect-timeout 5 --max-time 20 https://life-pilot.onrender.com/health || echo "fail"
          echo "Ping done"
