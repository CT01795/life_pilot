name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Use public pub.dev access
        run: dart pub token remove https://pub.dev || true

      - name: Install dependencies
        env:
          PUB_HOSTED_URL: https://pub.dev
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Web
        run: flutter build web --base-href "/life_pilot/" --release --dart-define=API_BASE_URL=https://life-pilot.onrender.com

  python-api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: python_ai_service

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python_ai_service/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall .

      - name: Test health endpoint
        run: python -m unittest discover -s tests
